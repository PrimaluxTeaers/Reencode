name: Update video icon

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-video-icon.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Download and generate icon variants
        run: |
          curl -L --fail -o /tmp/reencode-source.png 'https://aka.doubaocdn.com/s/8ZT2fnLz6w'
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/reencode-source.png').convert('RGB')
          im.resize((1024,1024), Image.LANCZOS).save('assets/icons/reencode-1024.png', optimize=True)
          im.resize((1024,1024), Image.LANCZOS).save('assets/icon.png', optimize=True)
          for size, folder in [(48,'mdpi'),(72,'hdpi'),(96,'xhdpi'),(144,'xxhdpi'),(192,'xxxhdpi')]:
              im.resize((size,size), Image.LANCZOS).save(f'android/app/src/main/res/mipmap-{folder}/ic_launcher.png', optimize=True)
          Image.open('/tmp/reencode-source.png').convert('RGB').resize((256,256), Image.LANCZOS).save('assets/icons/reencode.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          PY
      - name: Commit icon changes
        run: |
          git config user.name 'PrimaluxTeaers'
          git config user.email '13314702071@163.com'
          git add assets/icon.png assets/icons/reencode-1024.png assets/icons/reencode.ico android/app/src/main/res/mipmap-*/ic_launcher.png
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Update Reencode video icon'
          git push
