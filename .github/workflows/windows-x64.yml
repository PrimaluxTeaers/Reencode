name: Windows x64

# Builds the Windows x64 package on a real Windows runner. The `windows/`
# project files are generated here because Flutter can only scaffold them with
# the platform toolchain present, and the FFmpeg sidecar is fetched at build
# time instead of being committed to the repository.

on:
  workflow_dispatch:
  push:
    branches:
      - windows-port
      - main
    paths:
      - "lib/**"
      - "assets/icons/**"
      - ".github/workflows/windows-x64.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        shell: bash
        run: |
          flutter --version
          flutter config --enable-windows-desktop

      - name: Generate Windows runner
        shell: bash
        run: flutter create --platforms=windows --project-name reencode .

      - name: Apply the Reencode icon
        shell: pwsh
        run: |
          Copy-Item "assets/icons/reencode.ico" "windows/runner/resources/app_icon.ico" -Force
          Get-Item "windows/runner/resources/app_icon.ico" | Select-Object Name, Length

      - name: Set desktop window title and executable name
        shell: pwsh
        run: |
          $main = "windows/runner/main.cpp"
          $text = Get-Content $main -Raw
          $text = $text -replace 'Win32Window::Size size\(1280, 720\);', 'Win32Window::Size size(1180, 820);'
          $text = $text -replace 'window\.Create\(L"reencode"', 'window.Create(L"Reencode"'
          Set-Content $main $text -NoNewline

          $rc = "windows/runner/Runner.rc"
          $rcText = Get-Content $rc -Raw
          $rcText = $rcText -replace 'VALUE "FileDescription", "reencode"', 'VALUE "FileDescription", "Reencode"'
          $rcText = $rcText -replace 'VALUE "ProductName", "reencode"', 'VALUE "ProductName", "Reencode"'
          Set-Content $rc $rcText -NoNewline

      - name: Resolve packages
        shell: bash
        run: flutter pub get

      - name: Fetch FFmpeg x64 GPL build
        shell: pwsh
        run: |
          $Url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $Url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffbuild -Force
          $root = Get-ChildItem ffbuild -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path windows/ffmpeg | Out-Null
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe" windows/ffmpeg/
          Copy-Item "$($root.FullName)\bin\ffprobe.exe" windows/ffmpeg/

      - name: Build release
        shell: bash
        run: flutter build windows --release

      - name: Bundle FFmpeg beside the executable
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "$out/ffmpeg" | Out-Null
          Copy-Item "windows/ffmpeg/ffmpeg.exe" "$out/ffmpeg/"
          Copy-Item "windows/ffmpeg/ffprobe.exe" "$out/ffmpeg/"
          if (Test-Path "$out/reencode.exe") { Rename-Item "$out/reencode.exe" "Reencode.exe" -Force }
          Get-ChildItem $out | Select-Object Name, Length

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Reencode-WindowsX86-64-1.6.0.zip" -Force
          Get-Item "Reencode-WindowsX86-64-1.6.0.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Reencode-WindowsX86-64-1.6.0
          path: Reencode-WindowsX86-64-1.6.0.zip
          retention-days: 30

      - name: Replace the 1.6.0 Windows asset
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/windows-port'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.6.0
          gh release upload v1.6.0 "Reencode-WindowsX86-64-1.6.0.zip" --clobber
