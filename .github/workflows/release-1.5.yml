name: Release 1.5

on:
  push:
    paths:
      - .github/workflows/release-1.5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: https://aka.doubaocdn.com/s/02N4vgMn2I
      SOURCE_SHA256: 76f89edfaff7414463cbf16080d78e8c94c971bb57e9cebfcb9849941c56d004
      APK_URL: https://aka.doubaocdn.com/s/U5b0lft5kU
      APK_SHA256: 41aa0c158d8b778aa860a8ce79ae1887966ddcca337016a0ed4c908725ff1f7e
      APK_FILE: dist/Reencode-1.5.0-arm64-v8a.apk
      REPO_DESCRIPTION: "Android video transcoder: H.264 / H.265 / VP9 / MPEG-4, 1-100000 kbps, 4K/2K/1.5K, 8/10/12-bit, CFR plus experimental 90-144 fps. Windows port in progress. GPL-3.0. | 安卓视频转码：四种编码、最高 100 Mbps、4K/2K/1.5K、8/10/12-bit；Windows 版推进中。"
      REPO_HOMEPAGE: https://github.com/PrimaluxTeaers/Reencode/releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import 1.5 source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/source.zip "$SOURCE_URL"
          echo "$SOURCE_SHA256  /tmp/source.zip" | sha256sum -c -
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          cp -a /tmp/source/. .
          git config user.name "PrimaluxTeaers"
          git config user.email "PrimaluxTeaers@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source already up to date."
          else
            git commit -m "release: Reencode 1.5.0 source"
            git push origin HEAD:main
          fi

      - name: Update repository metadata
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api --method PATCH "repos/$GITHUB_REPOSITORY" -f description="$REPO_DESCRIPTION" -f homepage="$REPO_HOMEPAGE"
          echo "description_status=$?"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/topics" \
            -f 'names[]=android' -f 'names[]=windows' -f 'names[]=video' \
            -f 'names[]=video-converter' -f 'names[]=video-encoding' \
            -f 'names[]=transcoding' -f 'names[]=ffmpeg' -f 'names[]=h264' \
            -f 'names[]=h265' -f 'names[]=hevc' -f 'names[]=vp9' \
            -f 'names[]=mpeg4' -f 'names[]=hdr10' -f 'names[]=4k' \
            -f 'names[]=bitrate' -f 'names[]=flutter' -f 'names[]=dart'
          echo "topics_status=$?"

      - name: Download and verify APK
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -L --fail --retry 3 -o "$APK_FILE" "$APK_URL"
          echo "$APK_SHA256  $APK_FILE" | sha256sum -c -
          ls -lh "$APK_FILE"

      - name: Publish Android and Windows markers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin windows-port || true
          if git rev-parse --verify origin/windows-port >/dev/null 2>&1; then
            WINDOWS_SHA=$(git rev-parse origin/windows-port)
          else
            WINDOWS_SHA=$(git rev-parse HEAD)
          fi

          if gh release view android-v1.5.0 >/dev/null 2>&1; then
            gh release upload android-v1.5.0 "$APK_FILE" --clobber
          else
            gh release create android-v1.5.0 "$APK_FILE" \
              --title "Reencode 1.5.0 — Android arm64-v8a" \
              --notes-file RELEASE_NOTES_ANDROID.md
          fi

          if gh release view windows-v1.5.0 >/dev/null 2>&1; then
            echo "windows-v1.5.0 already exists."
          else
            gh release create windows-v1.5.0 \
              --target "$WINDOWS_SHA" \
              --title "Reencode 1.5.0 — Windows support marker" \
              --prerelease \
              --notes-file RELEASE_NOTES_WINDOWS.md
          fi

          {
            echo "## Release result"
            echo "- Android: https://github.com/$GITHUB_REPOSITORY/releases/tag/android-v1.5.0"
            echo "- Windows: https://github.com/$GITHUB_REPOSITORY/releases/tag/windows-v1.5.0"
            echo "- APK SHA-256: \`$APK_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
