name: Publish release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44101608214 -R PrimaluxTeaers/Reencode -n Reencode-WindowsX86-64-1.6.0 -D windows
          find windows -type f -maxdepth 2 -printf '%p %s bytes\n'

      - name: Download Android APK
        run: |
          curl --http1.1 -L --fail --retry 8 --retry-all-errors --retry-delay 3 -C - -o Reencode-AndroidARM64-v8a-1.6.0.apk https://aka.doubaocdn.com/s/vDdGC0Ergq
          test "$(stat -c%s Reencode-AndroidARM64-v8a-1.6.0.apk)" -eq 30526214

      - name: Upload assets to v1.6.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.6.0 -R PrimaluxTeaers/Reencode windows/*.zip Reencode-AndroidARM64-v8a-1.6.0.apk --clobber
